name = "beauty-studio-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
STUDIO_NAME = "美業工作室"
TENANT_ID = "tenant_beauty_studio_default"
DEFAULT_LINE_TENANT_ID = "tenant_beauty_studio_default"
LOCATION_ID = "location_main"
STAFF_ID = "staff_owner"

[[d1_databases]]
binding = "DB"
database_name = "beauty-studio-booking-v2"
database_id = "58e5f639-221d-4b7e-bc74-27dc83664d43"
migrations_dir = "migrations"

[env.v2-test]
name = "beauty-studio-api-v2-test"

[env.v2-test.vars]
STUDIO_NAME = "美業工作室 v2 測試"
TENANT_ID = "tenant_beauty_studio_default"
DEFAULT_LINE_TENANT_ID = "tenant_beauty_studio_default"
LOCATION_ID = "location_main"
STAFF_ID = "staff_owner"
DATA_BACKEND = "d1"
CUSTOMER_AI_ENABLED = "true"
CUSTOMER_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
OWNER_AI_ENABLED = "true"
OWNER_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
BOOKING_REQUIRES_OWNER_CONFIRMATION = "true"
OWNER_LIFF_CLIENT_ID = "2010868233"
FLAGSHIP_LIFF_CLIENT_ID = "2011024067"
STANDARD_LIFF_CLIENT_ID = "2011029740"
STANDARD_SHOWCASE_TENANT_ID = "acceptance-tenant_beauty_studio_default-beige"
STANDARD_SHOWCASE_LOCATION_ID = "acceptance-location-tenant_beauty_studio_default-beige"
STANDARD_SHOWCASE_STAFF_ID = "acceptance-owner-tenant_beauty_studio_default-beige"
FLAGSHIP_SHOWCASE_TENANT_ID = "acceptance-tenant_beauty_studio_default-mauve"
FLAGSHIP_SHOWCASE_LOCATION_ID = "acceptance-location-tenant_beauty_studio_default-mauve"
FLAGSHIP_SHOWCASE_STAFF_ID = "acceptance-owner-tenant_beauty_studio_default-mauve"
LINE_PROVIDER_ID = "2005385262"
LINE_LEGACY_SHOWCASE_ROUTES_ENABLED = "false"
LINE_SHOWCASE_SHARED_OA_ENABLED = "true"

# 僅 v2-test 啟用客人端與業主端 AI；不影響頂層或 v2-production。
[env.v2-test.ai]
binding = "AI"

[env.v2-test.triggers]
crons = ["*/5 * * * *"]

[[env.v2-test.d1_databases]]
binding = "DB"
database_name = "beauty-studio-booking-v2-test"
database_id = "d9dbde5c-290a-40f6-81a2-7169ab2aed5f"
migrations_dir = "migrations"

# 前後對比照片私有測試儲存：
# 使用既有空白測試 bucket，並保持 private
#（不開啟 public access、不設 custom domain）。
# 只綁在 env.v2-test，不影響頂層 Demo v1／Notion Worker。
[[env.v2-test.r2_buckets]]
binding = "PHOTO_BUCKET"
bucket_name = "beauty-studio-photos-v2-test"

# 正式環境設定草稿（僅本機設定，不新增 production deploy script、不執行 deploy）：
# 綁定既有 D1 beauty-studio-booking-v2 與既有 R2 beauty-studio-photos-v2，
# 非秘密 tenant／location／staff vars 與 v2-test 相同。
[env.v2-production]
name = "beauty-studio-api-v2-production"

[env.v2-production.vars]
STUDIO_NAME = "美業工作室 v2"
TENANT_ID = "tenant_beauty_studio_default"
DEFAULT_LINE_TENANT_ID = "tenant_beauty_studio_default"
LOCATION_ID = "location_main"
STAFF_ID = "staff_owner"
DATA_BACKEND = "d1"
BOOKING_REQUIRES_OWNER_CONFIRMATION = "true"
OWNER_LIFF_CLIENT_ID = "2010530394"
LINE_PROVIDER_ID = "2000536003"

[[env.v2-production.d1_databases]]
binding = "DB"
database_name = "beauty-studio-booking-v2"
database_id = "58e5f639-221d-4b7e-bc74-27dc83664d43"
migrations_dir = "migrations"

[[env.v2-production.r2_buckets]]
binding = "PHOTO_BUCKET"
bucket_name = "beauty-studio-photos-v2"
